<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feel Stress Free (FSF)</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
    overflow: hidden;
}

/* Background Glow Effect */
body::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 70%);
    top: -200px;
    right: -200px;
    border-radius: 50%;
}

.hero {
    text-align: center;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    padding: 60px;
    border-radius: 50%;
    width: 400px;
    height: 400px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 40px rgba(255,255,255,0.3);
    border: 3px solid rgba(255,255,255,0.4);
}

.hero h1 {
    font-size: 36px;
    margin: 0;
    background: linear-gradient(to right, #ffffff, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
}

.tagline {
    margin-top: 20px;
    font-size: 16px;
    opacity: 0.9;
}

.btn {
    margin-top: 25px;
    padding: 10px 25px;
    border-radius: 25px;
    border: none;
    background: white;
    color: #2a5298;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #ffd700;
    color: black;
}
</style>
</head>

<body>

<div class="hero">
    <h1>Feel Stress Free</h1>
    <div class="tagline">
        दिल से दिल की बातें सुनने के लिए हम हैं ना ❤️
    </div>
    <button class="btn">शुरू करें</button>
</div>

</body>
</html>
