<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feel Stress Free</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      max-width: 600px;
      padding: 30px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
    }
    p {
      line-height: 1.6;
      color: #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Feel Stress Free</h1>
    <p>Welcome to Feel Stress Free.<br>
    Take a deep breath and relax.</p>
  </div>
</body>
</html>
