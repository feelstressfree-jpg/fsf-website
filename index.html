<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feel Stress Free (FSF)</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0f172a;
color:white;
text-align:center;
}

header{
background:#1e293b;
padding:20px;
font-size:24px;
font-weight:bold;
}

.hero{
padding:60px 20px;
background:linear-gradient(135deg,#1e3c72,#2a5298,#4facfe,#00f2fe);
}

.price-box{
background:#1e293b;
padding:25px;
border-radius:15px;
max-width:400px;
margin:30px auto;
}

.old-price{
text-decoration:line-through;
color:#fca5a5;
font-size:20px;
}

.new-price{
font-size:36px;
color:#4ade80;
font-weight:bold;
}

input{
width:90%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:none;
}

button{
padding:12px 25px;
border:none;
border-radius:25px;
cursor:pointer;
background:white;
color:#1e3c72;
font-weight:bold;
font-size:16px;
margin-top:15px;
}
</style>
</head>

<body>

<header>Feel Stress Free (FSF)</header>

<div class="hero">
<h1>दिल से दिल की बातें सुनने के लिए हम हैं</h1>
<p>Payment के बाद हमारा listener आपको कॉल करेगा</p>
</div>

<div class="price-box">
<p class="old-price">₹120</p>
<p class="new-price" id="finalPrice">₹99</p>

<input type="text" id="userName" placeholder="आपका नाम">
<input type="tel" id="userPhone" placeholder="मोबाइल नंबर">
<input type="text" id="referral" placeholder="Referral Code (Optional)">

<button onclick="payNow()">₹99 में अभी जुड़ें</button>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
function payNow(){

let name = document.getElementById("userName").value;
let phone = document.getElementById("userPhone").value;
let referral = document.getElementById("referral").value || "DIRECT";

if(name=="" || phone==""){
alert("नाम और मोबाइल नंबर जरूरी है");
return;
}

var options = {
"key": "rzp_test_SFvvMaIQFRe0gr",
"amount": 9900,
"currency": "INR",
"name": "Feel Stress Free",
"description": "30 मिनट Audio Listening Session",
"handler": function (response){
alert("Payment Successful! Listener आपको कॉल करेगा");
},
"prefill": {
"name": name,
"contact": phone
},
"notes": {
"referral_code": referral
},
"theme": {
"color": "#2563eb"
}
};

var rzp = new Razorpay(options);
rzp.open();
}
</script>

</body>
</html>
